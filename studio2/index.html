<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Check Yourself</title>
    <script src="script.js" defer></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nothing+You+Could+Do&family=VT323&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <link href="styles.css" rel="stylesheet">
</head>

<body>
    <div id="container">
        <div id="clipboard">
            <div id="diagnosis">
                <h1>Brainrot diagnosis form</h1>
                <section class="form-section">
                    <h2>Patient Information</h2>
                    <div class="field-row">
                        <div class="fields-left">
                            <div class="field">
                                <label>Patient name:</label>
                                <span class="answer">Victoria Vo</span>
                            </div>
                            <div class="field">
                                <label>Sex:</label>
                                <div class="checkboxes">
                                    <input type="checkbox" id="male"><label for="male">Male</label>
                                    <input type="checkbox" id="female" checked><label for="female">Female</label>
                                    <input type="checkbox" id="other"><label for="other">Other</label>
                                </div>
                            </div>
                            <div class="field">
                                <label>Age:</label>
                                <span class="answer">22</span>
                            </div>
                        </div>
                        <div class="photo-box">
                            <img src="media/patient.png" alt="Patient photo">
                        </div>
                    </div>
                </section>

                <section class="form-section">
                    <h2>Overview</h2>
                    <div class="field-row">
                        <div class="field">
                            <label>Reels watched:</label>
                            <span class="answer" id="reels">179</span>
                        </div>
                        <div class="field">
                            <label>Date range:</label>
                            <span class="answer" id="date">April 17-18</span>
                        </div>
                    </div>
                </section>

                <section class="form-section">
                    <h2>Prescription</h2>
                    <p class="handwritten prescription-text" id="prescription">
                        Needs to touch grass and see friends, concerning level of brainrot
                    </p>
                </section>
            </div>
        </div>
         <div id="menu">
            <div>
                <button id="next">Next</button>
                <button id="prev">Previous</button>
            </div>
        </div>
    </div>
       

    </div>
</body>

</html>
